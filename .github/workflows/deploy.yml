name: Build & Deploy

# push เข้า main → build image บน runner → push ขึ้น GHCR → ssh เข้า VPS ให้ pull มารัน
# (build บน runner ไม่กิน RAM/CPU ของ VPS · pin tag เป็น sha ไว้ rollback ได้)
on:
  push:
    branches: [main]
  workflow_dispatch: # กดรันเองได้จากหน้า Actions

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ต้องมีถึงจะ push ขึ้น GHCR ได้
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: ตั้งชื่อ image (pin ด้วย commit sha)
        id: meta
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "latest=$IMAGE:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ NEXT_PUBLIC_* ต้องส่งตอน build (ฝังลง bundle) ไม่ใช่ตอนรัน
      # ✅ ไม่ต้องมี DATABASE_URL ตรงนี้ — หน้า public เป็น force-dynamic แล้ว build จึงไม่แตะ DB
      #    (เคยเป็นปัญหา ดู docs/problems.md 8.6)
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.SITE_URL }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            NEXT_PUBLIC_CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH เข้า VPS แล้ว pull image ใหม่มารัน
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # โฟลเดอร์บน VPS ที่มี docker-compose.yml + .env + Caddyfile วางอยู่
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            # เขียน tag ที่เพิ่ง build ลง .env → compose หยิบไปใช้ (rollback = แก้บรรทัดนี้แล้ว up -d)
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=\"${{ needs.build.outputs.image }}\"|" .env
            docker compose pull app
            docker compose up -d
            docker image prune -f
            # entrypoint ของ container รัน `prisma migrate deploy` ให้ก่อน start อยู่แล้ว
            docker compose ps
