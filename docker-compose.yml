# Thaingam-web — production stack บน VPS
#
# ใช้งาน:
#   docker compose pull && docker compose up -d          # แอป + ฐานข้อมูล
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d   # ถ้าจะให้ Caddy ทำ HTTPS ให้ด้วย
#
# ค่าลับทั้งหมดอ่านจากไฟล์ `.env` ที่วางไว้ข้าง ๆ ไฟล์นี้บน VPS (ดู .env.production.example)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # ให้ collation ไทยเรียงถูก (ตั้งได้ตอนสร้าง cluster ครั้งแรกเท่านั้น)
      LANG: th_TH.utf8
    volumes:
      - db-data:/var/lib/postgresql/data
      # สคริปต์สำรองข้อมูลเขียนลงโฟลเดอร์นี้ (ดู README ท้ายไฟล์)
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ⚠️ ผูกกับ 127.0.0.1 เท่านั้น — เปิดจากอินเทอร์เน็ตไม่ได้ ต้อง SSH เข้าเครื่องก่อน
    # ใช้ตอน seed ครั้งแรก / สำรอง-กู้ข้อมูล ผ่าน SSH tunnel (ดู docs/deploy.md)
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"

  app:
    # tag ถูกแทนที่โดย GitHub Actions ตอน deploy (pin เป็น sha ไว้ rollback ได้)
    image: ${APP_IMAGE:-ghcr.io/greengramhouse/thaingam-web-latest:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 🔥 ต้องมี — โค้ดฝั่ง server ตี "เวลาท้องถิ่น" = เวลาไทย
      #    <input type="datetime-local"> ส่ง "yyyy-MM-ddTHH:mm" (ไม่มี offset) → `new Date()` ใช้ TZ ของ process
      #    ถ้าปล่อยเป็น UTC (ค่าเริ่มต้นของ container) เวลาที่บันทึกจะเพี้ยน **+7 ชม.**
      #    → ประกาศ/กิจกรรมไม่โผล่ตามเวลาที่แอดมินตั้ง (เจอจริง 2026-07-25 · problems.md 8.9)
      #    มีผลกับการแสดงผลวันที่ฝั่ง server ด้วย (date-fns อิง TZ ของ process เช่นกัน)
      TZ: Asia/Bangkok
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${SITE_URL}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    expose:
      - "3000"
    # เปิดพอร์ตออก localhost ของ VPS ให้ reverse proxy ของเครื่อง (Caddy) ชี้มา
    # ⚠️ ค่าเริ่มต้น 3001 ไม่ใช่ 3000 — VPS เครื่องนี้มี StockApp ครอง 127.0.0.1:3000 อยู่แล้ว
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3001}:3000"

volumes:
  db-data:
